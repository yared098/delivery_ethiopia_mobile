name: deliver_ethiopia
description: Deliver Ethiopia customer mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.7.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  flutter_dotenv: ^6.0.1
  google_maps_flutter: ^2.18.1
  google_maps_flutter_android: ^2.19.13
  google_maps_flutter_ios: ^2.18.6
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^18.0.1
  go_router: ^17.5.0
  # geocoding: ^5.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo_monochrome.png"
  min_sdk_android: 21

  # Android adaptive icon (Android 8+)
  adaptive_icon_background: "#0A7E3D"        # or "assets/icon/bg.png"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"

  # Android 13+ monochrome / themed
  adaptive_icon_monochrome: "assets/icon/logo_monochrome.png"

  # iOS: remove alpha channel automatically
  remove_alpha_ios: true

  # Optional: web
  web:
    generate: false